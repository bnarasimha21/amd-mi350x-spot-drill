<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Spot GPU Training Drill deployment today</title><desc>An operator laptop runs the orchestrator and holds the cloud API token. Inside one DigitalOcean account are a small controller Droplet with a webhook and event log, a Spot GPU Droplet running the trainer and drain agent, a replacement Spot GPU Droplet created during the drill, and a private object storage bucket that holds the checkpoint. Model weights and the dataset come from Hugging Face. Boundaries are drawn as dashed lines.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker></defs><rect x="0" y="0" width="1000" height="800" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">Spot GPU Training Drill: Where It Runs Today</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">One laptop drives everything. Nothing here is a managed service or a scheduler. Dashed lines are trust boundaries.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">OPERATOR</text><rect x="30" y="104" width="220" height="330" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="46" y="126" font-size="11.5" fill="#2C2C2A" font-weight="600">Boundary: the laptop</text><text x="46" y="141" font-size="10.5" fill="#5F5E5A">trusted: the operator</text><rect x="46" y="160" width="188" height="98" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><text x="58" y="181" font-size="13" fill="#3C3489" font-weight="600">Orchestrator</text><text x="58" y="198" font-size="10.5" fill="#3C3489">self_reclaim.sh: HTTP with a</text><text x="58" y="212.5" font-size="10.5" fill="#3C3489">token to the controller, SSH</text><text x="58" y="227.0" font-size="10.5" fill="#3C3489">and the DO API to the nodes;</text><text x="58" y="241.5" font-size="10.5" fill="#3C3489">creates, verifies, destroys</text><rect x="46" y="300" width="188" height="98" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="58" y="321" font-size="13" fill="#2C2C2A" font-weight="600">.env and .state</text><text x="58" y="338" font-size="10.5" fill="#5F5E5A">DO_TOKEN never leaves</text><text x="58" y="352.5" font-size="10.5" fill="#5F5E5A">this machine; GPU nodes</text><text x="58" y="367.0" font-size="10.5" fill="#5F5E5A">get only the Spaces key</text><text x="58" y="381.5" font-size="10.5" fill="#5F5E5A">and the drill token</text><text x="290" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">ONE DIGITALOCEAN ACCOUNT</text><rect x="290" y="104" width="680" height="560" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="306" y="126" font-size="11.5" fill="#2C2C2A" font-weight="600">Boundary: cloud firewalls, by tag</text><text x="306" y="141" font-size="10.5" fill="#5F5E5A">controller: 8080 and SSH from the operator IP and the GPU tag; GPU nodes: SSH from the operator IP</text><rect x="306" y="160" width="300" height="98" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><text x="318" y="181" font-size="13" fill="#3C3489" font-weight="600">Controller Droplet (nyc3, 1 vCPU)</text><text x="318" y="198" font-size="10.5" fill="#3C3489">Flask webhook on 8080, plain HTTP;</text><text x="318" y="212.5" font-size="10.5" fill="#3C3489">events.jsonl, every event stamped by</text><text x="318" y="227.0" font-size="10.5" fill="#3C3489">this one clock; drain flags in memory</text><rect x="654" y="160" width="300" height="98" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="666" y="181" font-size="13" fill="#2C2C2A" font-weight="600">What the controller decides</text><text x="666" y="198" font-size="10.5" fill="#5F5E5A">nothing. It records the notice, answers</text><text x="666" y="212.5" font-size="10.5" fill="#5F5E5A">/status and keeps the log. The laptop</text><text x="666" y="227.0" font-size="10.5" fill="#5F5E5A">decides when to create and destroy</text><rect x="306" y="316" width="300" height="112" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="318" y="337" font-size="13" fill="#2C2C2A" font-weight="600">Spot GPU Droplet A (ric1)</text><text x="318" y="354" font-size="10.5" fill="#5F5E5A">MI350X, 288 GB; one container holds</text><text x="318" y="368.5" font-size="10.5" fill="#5F5E5A">the trainer and the drain agent, so the</text><text x="318" y="383.0" font-size="10.5" fill="#5F5E5A">agent can signal the trainer by PID;</text><text x="318" y="397.5" font-size="10.5" fill="#5F5E5A">NVMe scratch holds the checkpoint</text><rect x="654" y="316" width="300" height="112" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="666" y="337" font-size="13" fill="#2C2C2A" font-weight="600">Spot GPU Droplet B (replacement)</text><text x="666" y="354" font-size="10.5" fill="#5F5E5A">created only after node_safe; ric1, or</text><text x="666" y="368.5" font-size="10.5" fill="#5F5E5A">MI355X in mem1 when ric1 has no</text><text x="666" y="383.0" font-size="10.5" fill="#5F5E5A">capacity; pulls, verifies, resumes;</text><text x="666" y="397.5" font-size="10.5" fill="#5F5E5A">A is destroyed after B reports resume_ok</text><rect x="306" y="490" width="648" height="62" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><text x="318" y="511" font-size="13" fill="#0F6E56" font-weight="600">Spaces bucket (ric1, private)</text><text x="318" y="528" font-size="10.5" fill="#0F6E56">98.3 GB checkpoint in four files plus a _COMPLETE marker; one bucket-scoped read/write key on both GPU nodes</text><path d="M234,200 L302,200" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M234,240 L280,240" fill="none" stroke="#888780" stroke-width="2"/><path d="M280,240 L280,360 L302,360" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M400,316 L400,262" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="408" y="293" font-size="10.5" fill="#5F5E5A">poll /status every 5 s, post events</text><path d="M800,316 L800,290 L640,290 L640,240 L610,240" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="700" y="284" font-size="10.5" fill="#5F5E5A">resume_ok</text><path d="M400,428 L400,486" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="408" y="462" font-size="10.5" fill="#5F5E5A">upload, 264 s at 2.97 Gbps</text><path d="M800,490 L800,432" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="808" y="462" font-size="10.5" fill="#5F5E5A">download, 244 s</text><text x="306" y="584" font-size="10.5" fill="#A32D2D">The webhook is plain HTTP on a public address, and GET /status and /events need no token: the firewall is the only guard.</text><text x="306" y="599" font-size="10.5" fill="#A32D2D">Drain flags are in memory, so a controller restart forgets a notice in flight (the event log survives).</text><text x="306" y="614" font-size="10.5" fill="#A32D2D">rng.pt is loaded with pickle, so the bucket has to be trusted. Checkpoint bytes are not checksummed end to end.</text><text x="306" y="629" font-size="10.5" fill="#A32D2D">The laptop is a single point of failure: if it sleeps mid-drill, nothing creates the replacement.</text><rect x="30" y="470" width="220" height="194" rx="12" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="7 5"/><text x="46" y="492" font-size="11.5" fill="#A32D2D" font-weight="600">Outside the account</text><text x="46" y="507" font-size="10.5" fill="#A32D2D">untrusted</text><rect x="46" y="526" width="188" height="84" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="58" y="547" font-size="13" fill="#A32D2D" font-weight="600">Hugging Face</text><text x="58" y="564" font-size="10.5" fill="#A32D2D">Qwen3-8B weights and</text><text x="58" y="578.5" font-size="10.5" fill="#A32D2D">alpaca-cleaned, fetched</text><text x="58" y="593.0" font-size="10.5" fill="#A32D2D">at bootstrap on each node</text><path d="M306,410 L270,410 L270,568 L238,568" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="30" y="700" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="716" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#888780" stroke-dasharray="3 2"/><text x="54" y="728" font-size="11.5" fill="#5F5E5A">Trust boundary</text><rect x="186.2" y="716" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#7F77DD"/><text x="210.2" y="728" font-size="11.5" fill="#5F5E5A">Coordinates the drill</text><rect x="386.5" y="716" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#1D9E75"/><text x="410.5" y="728" font-size="11.5" fill="#5F5E5A">Durable checkpoint</text><rect x="567.9" y="716" width="16" height="16" rx="4" fill="#FCEBEB" stroke="#E24B4A"/><text x="591.9" y="728" font-size="11.5" fill="#5F5E5A">Outside or unauthenticated</text><text x="30" y="768" font-size="11" fill="#5F5E5A">What this shows: one GPU, one job, one operator, one bucket. Section 8 of the design record covers a fleet with a real notice path and a scheduler.</text></svg>
