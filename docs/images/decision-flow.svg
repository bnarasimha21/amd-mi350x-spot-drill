<svg viewBox="0 0 1000 1036" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Spot GPU Training Drill reclamation flow</title><desc>One reclamation in eight steps: notice, drain signal, checkpoint to local disk, upload to object storage, create a replacement, download, verify and resume, then destroy the old node. Six of the steps have an exit where the drill stops with the old node still running, and every step posts an event stamped by the controller&#x27;s clock.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker></defs><rect x="0" y="0" width="1000" height="1036" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">Spot GPU Training Drill: One Reclamation, Every Exit</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">Create, verify, then destroy. Every failure stops the drill with the old node still running.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">ONE RECLAMATION THROUGH THE DRILL</text><text x="610" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">WHERE IT STOPS (OLD NODE KEPT)</text><rect x="30" y="108" width="500" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><circle cx="54" cy="132" r="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="54" y="136" font-size="12" fill="#2C2C2A" font-weight="600" text-anchor="middle">1</text><text x="76" y="136" font-size="14" fill="#2C2C2A" font-weight="600">Reclamation notice reaches the controller</text><text x="76" y="154" font-size="11" fill="#5F5E5A">simulated: a POST shaped like the provider&#x27;s email, naming one node;</text><text x="76" y="169" font-size="11" fill="#5F5E5A">the run gets a fresh run id and the event log is reset</text><path d="M280,178 L280,201" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="204" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="228" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="232" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">2</text><text x="76" y="232" font-size="14" fill="#0F6E56" font-weight="600">Drain agent sees &#x27;draining&#x27; and signals the trainer</text><text x="76" y="250" font-size="11" fill="#0F6E56">polls /status every 5 s; checks the PID really is train.py,</text><text x="76" y="265" font-size="11" fill="#0F6E56">then sends SIGUSR1</text><path d="M280,274 L280,297" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,239.0 L606,239.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="208" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="231" font-size="13" fill="#A32D2D" font-weight="600">No live train.py process</text><text x="622" y="248" font-size="11" fill="#A32D2D">drain_failed is posted; nothing is signalled</text><rect x="30" y="300" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="324" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="328" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">3</text><text x="76" y="328" font-size="14" fill="#0F6E56" font-weight="600">Trainer finishes its step and writes the checkpoint</text><text x="76" y="346" font-size="11" fill="#0F6E56">weights, optimizer, scheduler, RNG and data cursor to a staging</text><text x="76" y="361" font-size="11" fill="#0F6E56">directory; fsync, atomic rename, then exit</text><path d="M280,370 L280,393" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,335.0 L606,335.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="304" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="327" font-size="13" fill="#A32D2D" font-weight="600">Trainer exits without a drain checkpoint</text><text x="622" y="344" font-size="11" fill="#A32D2D">drain_failed; a half-written directory is never</text><text x="622" y="359" font-size="11" fill="#A32D2D">eligible (dot-prefixed staging, meta.json required)</text><rect x="30" y="396" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="420" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="424" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">4</text><text x="76" y="424" font-size="14" fill="#0F6E56" font-weight="600">Upload to object storage, marker last</text><text x="76" y="442" font-size="11" fill="#0F6E56">four files in about 32 parallel streams; _COMPLETE is written only</text><text x="76" y="457" font-size="11" fill="#0F6E56">after every file has landed; the agent then reports node_safe</text><path d="M280,466 L280,489" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,431.0 L606,431.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="400" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="423" font-size="13" fill="#A32D2D" font-weight="600">An upload fails, or node_safe never arrives</text><text x="622" y="440" font-size="11" fill="#A32D2D">no marker is written; the orchestrator times out</text><text x="622" y="455" font-size="11" fill="#A32D2D">at 40 minutes and creates nothing</text><rect x="30" y="492" width="500" height="70" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><circle cx="54" cy="516" r="12" fill="#FFFFFF" stroke="#7F77DD"/><text x="54" y="520" font-size="12" fill="#3C3489" font-weight="600" text-anchor="middle">5</text><text x="76" y="520" font-size="14" fill="#3C3489" font-weight="600">Create the replacement Spot node</text><text x="76" y="538" font-size="11" fill="#3C3489">only after node_safe; two GPU nodes bill until the old one goes;</text><text x="76" y="553" font-size="11" fill="#3C3489">waits for a real shell and a visible GPU, then bootstraps</text><path d="M280,562 L280,585" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,527.0 L606,527.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="496" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="519" font-size="13" fill="#A32D2D" font-weight="600">No Spot capacity</text><text x="622" y="536" font-size="11" fill="#A32D2D">tries the fallback region and GPU; if that is dry</text><text x="622" y="551" font-size="11" fill="#A32D2D">too, the drill stops</text><rect x="30" y="588" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="612" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="616" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">6</text><text x="76" y="616" font-size="14" fill="#0F6E56" font-weight="600">Download the checkpoint on the replacement</text><text x="76" y="634" font-size="11" fill="#0F6E56">lists the bucket prefix and pulls the four files</text><text x="76" y="649" font-size="11" fill="#0F6E56">in parallel</text><path d="M280,658 L280,681" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,623.0 L606,623.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="592" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="615" font-size="13" fill="#A32D2D" font-weight="600">No _COMPLETE marker in the bucket</text><text x="622" y="632" font-size="11" fill="#A32D2D">the download refuses to start</text><rect x="30" y="684" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="708" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="712" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">7</text><text x="76" y="712" font-size="14" fill="#0F6E56" font-weight="600">Restore, verify, resume</text><text x="76" y="730" font-size="11" fill="#0F6E56">recompute the next batch ids and the RNG fingerprint and compare</text><text x="76" y="745" font-size="11" fill="#0F6E56">with what was saved; then print RESUME OK and train on</text><path d="M280,754 L280,777" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,719.0 L606,719.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="688" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="711" font-size="13" fill="#A32D2D" font-weight="600">Data cursor or RNG fingerprint differs</text><text x="622" y="728" font-size="11" fill="#A32D2D">assertion fails, no resume_ok; times out</text><text x="622" y="743" font-size="11" fill="#A32D2D">at 20 minutes</text><rect x="30" y="780" width="500" height="70" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><circle cx="54" cy="804" r="12" fill="#FFFFFF" stroke="#7F77DD"/><text x="54" y="808" font-size="12" fill="#3C3489" font-weight="600" text-anchor="middle">8</text><text x="76" y="808" font-size="14" fill="#3C3489" font-weight="600">Rescue records, destroy the old node</text><text x="76" y="826" font-size="11" fill="#3C3489">timings and losses copied to the laptop first;</text><text x="76" y="841" font-size="11" fill="#3C3489">the only destructive step, and the last one</text><text x="30" y="872" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">EVERY STEP LEAVES A RECORD</text><rect x="30" y="888" width="940" height="50" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="500" y="909" font-size="13" fill="#2C2C2A" font-weight="600" text-anchor="middle">Each stage posts an event to the controller, which stamps it with one clock and the run id</text><text x="500" y="927" font-size="11" fill="#5F5E5A" text-anchor="middle">waits match on this run&#x27;s id only, so a stale event from an earlier run cannot satisfy them; timings.csv and losses.jsonl stay on the node</text><text x="30" y="960" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="976" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#1D9E75"/><text x="54" y="988" font-size="11.5" fill="#5F5E5A">Verified before moving on</text><rect x="255.5" y="976" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#7F77DD"/><text x="279.5" y="988" font-size="11.5" fill="#5F5E5A">Changes what is billed</text><rect x="462.1" y="976" width="16" height="16" rx="4" fill="#FCEBEB" stroke="#E24B4A"/><text x="486.1" y="988" font-size="11.5" fill="#5F5E5A">Stopped, old node kept</text><text x="30" y="1018" font-size="11" fill="#5F5E5A">Measured once (2026-08-18): notice to durable state 322.6 s; replacement usable in 201 s; 0 steps redone. A real reclamation takes the old node whether or not the drill is ready.</text></svg>
