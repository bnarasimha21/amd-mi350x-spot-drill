name: Syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q drain trainer queue_demo

      - name: Check shell syntax
        run: |
          for file in provision/*.sh drain/*.sh; do
            bash -n "$file"
          done
