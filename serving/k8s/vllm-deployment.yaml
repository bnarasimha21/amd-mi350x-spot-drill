# OpenAI-compatible vLLM server, one GPU per pod, one pod per GPU node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels: {app: vllm}
spec:
  # KEDA owns the replica count once the ScaledObject exists. This is only the first value.
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # There is no spare GPU to surge onto. Take one pod down, bring its replacement up.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels: {app: vllm}
    spec:
      # Termination budget, in order:
      #   preStop sleep (15 s)        the pod is already out of the Service; let that reach
      #                               every node before the server is told anything
      #   SHUTDOWN_TIMEOUT_S (120 s)  vLLM finishes in-flight requests after SIGTERM
      #   margin (45 s)
      # After this the kubelet sends SIGKILL and whatever is still streaming is cut.
      terminationGracePeriodSeconds: 180
      nodeSelector:
        doks.digitalocean.com/gpu-brand: amd
      tolerations:
        # DOKS taints AMD GPU nodes amd.com/gpu:NoSchedule.
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm-rocm   # replaced by the images: entry in kustomization.yaml
          # The image's entrypoint is the server; these are its arguments, as in the
          # documented `docker run ... vllm/vllm-openai-rocm:<tag> --model <id>`.
          args:
            - --model=$(MODEL_ID)
            - --served-model-name=$(SERVED_MODEL_NAME)
            - --host=0.0.0.0
            - --port=8000
            - --max-model-len=$(MAX_MODEL_LEN)
            - --max-num-seqs=$(MAX_NUM_SEQS)
            - --shutdown-timeout=$(SHUTDOWN_TIMEOUT_S)
          envFrom:
            - configMapRef: {name: vllm-config}
          env:
            - name: HF_HOME
              value: /model-cache/hf
            # Only needed for gated models. Create it by hand; it is never in Git:
            #   kubectl -n vllm create secret generic hf-token --from-literal=token=...
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: token, optional: true}
          ports:
            - {name: http, containerPort: 8000}
          resources:
            # Placeholders for CPU and memory until the node's allocatable is read in the
            # runbook. The GPU line is what pins one pod to one GPU.
            requests: {cpu: "4", memory: 32Gi}
            limits: {amd.com/gpu: "1"}
          # Model download and load are slow, and both happen again on every new node.
          # 180 x 10 s = 30 minutes before the kubelet gives up and restarts the container.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 180
          # /health answers 200 only once the engine is up, so Ready means "can serve".
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              # Keep serving while the endpoint removal propagates. New requests stop
              # arriving during this window; requests already here keep streaming.
              sleep: {seconds: 15}
          volumeMounts:
            - {name: model-cache, mountPath: /model-cache}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        # Node-local cache: survives pod and container restarts on the same node, and is
        # lost with the node, which is what a spot node does anyway. It is not a billed
        # volume, so there is nothing to forget at teardown. A new node downloads the
        # weights again; the runbook times that.
        - name: model-cache
          hostPath: {path: /var/lib/vllm-model-cache, type: DirectoryOrCreate}
        # Stands in for docker's --ipc=host from the vLLM docs.
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
